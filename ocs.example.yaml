# OpenCode Context Shunt - example policy
version: 1
mode: enforce # dry-run | enforce

thresholds:
  directReadTokens: 800
  largeReadTokens: 4000
  shellOutputTokens: 1500
  maxReturnTokens: 1200

# Smart Read thresholds (SPEC section 10.2) - also accepted under tools.read
read:
  direct_max_lines: 250
  direct_max_tokens: 4000
  semantic_map_min_lines: 251
  huge_file_min_tokens: 20000
  targeted_range_max_tokens: 6000
  maximum_summary_tokens: 1500

tiers:
  T0:
    enabled: true
  T1:
    enabled: true
    model:
      providerID: local
      id: slm-default
  T2:
    enabled: true
    model:
      providerID: openai
      id: gpt-4.1-mini
  T3:
    enabled: true
    # primary / frontier - usually the OpenCode session model

tools:
  read:
    enabled: true
    override_builtin: true
    direct_max_lines: 250
    direct_max_tokens: 4000
    semantic_map_min_lines: 251
    huge_file_min_tokens: 20000
    targeted_max_tokens: 6000
    maximum_return_tokens: 1500
    worker_tier: T0

cache:
  backend: filesystem
  path: .ocs/cache

telemetry:
  enabled: true
  prometheus: false

security:
  redactSecrets: true
  blockUnapprovedExternalModels: false
